events { }

http {
  upstream reservation { server reservation:8080; }
  upstream member      { server member:8080; }
  upstream menu        { server menu:8080; }
  upstream order       { server order:8080; }
  upstream payment     { server payment:8080; }
  upstream notification { server notification:8080; }

  server {
    listen 80;

    # 健康检查
    location /healthz {
      return 200 '{"status":"healthy","service":"api-gateway"}';
      add_header Content-Type application/json;
    }

    # 预约服务
    location /api/reservations {
      proxy_pass http://reservation;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # 会员服务
    location /api/members {
      proxy_pass http://member;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # 菜单服务
    location /api/menu-items {
      proxy_pass http://menu;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
    location /api/categories {
      proxy_pass http://menu;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # 订单服务
    location /api/orders {
      proxy_pass http://order;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # 支付服务
    location /api/payments {
      proxy_pass http://payment;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # 通知服务
    location /api/notifications {
      proxy_pass http://notification;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }
}
